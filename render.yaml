services:
  - type: web
    name: persona-reality-check
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
